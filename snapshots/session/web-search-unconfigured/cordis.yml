# Live-recording patch: the search key reference names no credential, so the
# model request withholds web_search while the rest of the tool surface stays.
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DSH_SNAPSHOT_UNSET_SEARCH_KEY

# The shipped search route is keyless Exa MCP; pin the credentialed DeepSeek
# route so this scenario exercises an unconfigured search provider.
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official
    fetchProvider: http
