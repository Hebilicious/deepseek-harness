# Replay twin of acp-bridged-subagent's cordis.yml: identical because the
# harness is the package's scripted mock ACP agent in both modes — no external
# model adapter needs replacing.

- id: agent-loop
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: agent-tool-bridge
      name: '../../../packages/core/agent-tool-bridge/src/index.ts'

    - id: agent-acp
      name: '../../../packages/core/agent-acp/src/index.ts'
      config:
        harnesses:
          - id: devin
            name: Devin
            description: scripted ACP agent for the snapshot corpus
            executable: !!js process.execPath
            args: !!js "[new URL('../../../packages/core/agent-acp/tests/mock-acp-agent.ts', 'file://' + process.env.DSH_SNAPSHOT_FILE).pathname, 'acp']"
            probeCatalog: false
            authStatusArgs: []
            authLogoutArgs: []
            env:
              MOCK_MCP_HTTP: '1'
              MOCK_MCP_PROMPT_ONCE: '1'
              MOCK_TEXT: 'snapshot acp answer'
              MOCK_CONFIG_OPTIONS: '[{"id":"model","name":"Model","type":"select","currentValue":"mock-1","options":[{"value":"mock-1","name":"Mock 1"}]},{"id":"mode","name":"Mode","type":"select","currentValue":"bypass","options":[{"value":"bypass","name":"Bypass"},{"value":"ask","name":"Ask"},{"value":"accept-edits","name":"Accept edits"}]}]'
              MOCK_MCP_PROMPT_CALL: '{"name":"subagent","arguments":{"description":"snapshot child","prompt":"Answer with one word.","run_in_background":false}}'
